<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 580" role="img" aria-label="可爱的星球宝宝">
  <defs>
    <linearGradient id="planet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd6e0"/>
      <stop offset="1" stop-color="#ff9fc0"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#cdb4f6"/>
      <stop offset="1" stop-color="#9d7be8"/>
    </linearGradient>
  </defs>
  <rect width="800" height="580" rx="24" fill="#fff7ee"/>

  <g class="spark s1"><circle cx="640" cy="120" r="8" fill="#ffd6a5"/></g>
  <g class="spark s2"><circle cx="150" cy="110" r="7" fill="#ffb3c6"/></g>
  <g class="spark s3"><circle cx="690" cy="390" r="9" fill="#a8d8ff"/></g>
  <g class="spark s4"><circle cx="120" cy="420" r="6" fill="#cdb4f6"/></g>
  <g class="spark s5"><path d="M220 80 l6 16 16 6 -16 6 -6 16 -6 -16 -16 -6 16 -6 z" fill="#ffd166"/></g>
  <g class="spark s6"><path d="M600 440 l5 14 14 5 -14 5 -5 14 -5 -14 -14 -5 14 -5 z" fill="#ff9fc0"/></g>

  <g class="float-group">
    <ellipse cx="400" cy="360" rx="210" ry="62" fill="#cdb4f6" opacity="0.5" transform="rotate(-16 400 360)"/>
    <circle cx="400" cy="300" r="170" fill="url(#planet)" stroke="#2b2233" stroke-width="10"/>
    <ellipse cx="400" cy="318" rx="150" ry="40" fill="#fff7ee" opacity="0.35"/>
    <path d="M400 120 a170 170 0 0 1 170 170" fill="none" stroke="#fff7ee" stroke-width="18" stroke-linecap="round" opacity="0.7"/>
    <ellipse cx="400" cy="298" rx="120" ry="86" fill="none" stroke="url(#ring)" stroke-width="22" transform="rotate(-18 400 298)"/>

    <!-- kawaii 脸 -->
    <g class="face">
      <circle cx="330" cy="270" r="15" fill="#2b2233"/>
      <circle cx="470" cy="270" r="15" fill="#2b2233"/>
      <circle cx="337" cy="263" r="5" fill="#fff"/>
      <circle cx="477" cy="263" r="5" fill="#fff"/>
      <circle cx="310" cy="310" r="16" fill="#ff9fc0" opacity="0.8"/>
      <circle cx="490" cy="310" r="16" fill="#ff9fc0" opacity="0.8"/>
      <path d="M365 320 q35 30 70 0" fill="none" stroke="#2b2233" stroke-width="10" stroke-linecap="round"/>
      <g class="wink"><circle cx="470" cy="270" r="15" fill="#2b2233"/><path d="M455 270 q15 -12 30 0" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/></g>
    </g>
  </g>
  <animateTransform attributeName="transform" type="translate" values="0 0; 0 -12; 0 0; 0 -12; 0 0" dur="3.2s" repeatCount="indefinite"/>
</svg>
